<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Claude cost per task, cloud vision versus on-device skills">
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .grid{stroke:#e4e3df} .axis{stroke:#b9b8b2}
  .cloud{fill:#2a78d6} .local{fill:#eb6834} .bad{fill:#c62828}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .grid{stroke:#2e2e2c} .axis{stroke:#55544f}
    .cloud{fill:#3987e5} .local{fill:#d95926} .bad{fill:#ff6b6b}
  }
</style>
<rect class="bg" width="760" height="484" rx="8"/>
<text class="t1" x="20" y="30" font-size="16" font-weight="600">What Claude spends per task: reading it itself vs handing it to on-device fm</text>
<text class="t2" x="20" y="50" font-size="12">Claude’s spend only (the on-device fm work is free). Median of 3 runs, claude-opus-5-5, USD list price. Lower is better.</text>
<rect class="cloud" x="20" y="62" width="12" height="12" rx="2"/><text class="t2" x="38" y="72" font-size="12">Claude reads it (cloud vision)</text>
<rect class="local" x="250" y="62" width="12" height="12" rx="2"/><text class="t2" x="268" y="72" font-size="12">Claude + on-device fm skills</text>
<text class="t2" x="740" y="72" font-size="12" text-anchor="end">change · correct with skills</text>
<line class="grid" x1="150.0" x2="150.0" y1="86" y2="450"/><text class="t2" x="150.0" y="466" font-size="11" text-anchor="middle">$0.00</text>
<line class="grid" x1="242.0" x2="242.0" y1="86" y2="450"/><text class="t2" x="242.0" y="466" font-size="11" text-anchor="middle">$0.05</text>
